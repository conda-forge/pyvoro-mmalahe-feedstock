schema_version: 1

context:
  name: pyvoro-mmalahe
  version: "1.3.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyvoro-mmalahe-${{ version }}.tar.gz
  sha256: 810edf4ddf978f0b089285bcf2e805ef98cc314fddeb04f84deacb624691b47a

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - pyvoro
      pip_check: true

about:
  summary: "2D and 3D Voronoi tessellations: a python entry point for the voro++ library."
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/mmalahe/pyvoro

extra:
  recipe-maintainers:
    - jan-janssen
